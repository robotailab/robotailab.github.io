<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="apple-touch-icon" href="/assets/img/logo.png">
    <style>
      .pub-list {
        list-style: none;
        padding-left: 0;
        counter-reset: pub var(--pub-count);
      }
      .pub-list > li {
        counter-increment: pub -1;
        position: relative;
        padding-left: 3rem;
      }
      .pub-list > li::before {
        content: "[" counter(pub) "] ";
        font-weight: 600;
        position: absolute;
        left: 0;
        top: 0;
        width: 2.5rem;
        text-align: right;
      }
      .prof-photo {
        height: 181px;
        width: auto;
        object-fit: contain;
        display: block;
      }
      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .highlight-img {
        width: 100%;
        height: 360px;
        object-fit: fill;
        display: block;
      }
      .equipment-img {
        width: 100%;
        max-height: 180px;
        object-fit: contain;
      }
      .news-date-badge {
        min-width: 86px;
        text-align: center;
        letter-spacing: 0.02em;
      }
      .news-link {
        text-decoration: none;
        white-space: nowrap;
        color: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 8px;
        border-radius: 999px;
        gap: 6px;
        border: 1px solid var(--bs-border-color);
        background: rgba(var(--bs-body-color-rgb), 0.06);
        font-weight: 600;
        letter-spacing: 0.01em;
        font-size: 0.82rem;
        line-height: 1;
      }
      .news-link-text {
        font-size: 0.82rem;
        line-height: 1;
      }
      .news-link:hover {
        background: rgba(var(--bs-body-color-rgb), 0.12);
        text-decoration: none;
      }
      [data-bs-theme="dark"] .news-link:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .navbar-brand-icon {
        height: 32px;
        width: auto;
        object-fit: contain;
        display: inline-block;
        filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.35));
      }
      [data-bs-theme="dark"] .navbar-brand-icon {
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.4));
      }
      .project-date {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .project-date-cell,
      .project-title-cell,
      .project-org-cell {
        font-size: 1rem;
        line-height: 1.5;
      }
      .project-badge {
        letter-spacing: 0.01em;
      }
      .course-badge-graduate {
        letter-spacing: 0.01em;
      }
      .course-badge {
        min-width: 7.5rem;
        text-align: center;
      }
      [data-bs-theme="dark"] .project-badge {
        background-color: rgba(255, 255, 255, 0.14);
        color: #f8f9fa;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      [data-bs-theme="dark"] .course-badge-graduate {
        background-color: rgba(255, 255, 255, 0.18);
        color: #f8f9fa;
        border: 1px solid rgba(255, 255, 255, 0.30);
      }
      [data-bs-theme="dark"] .equipment-title-badge {
        background-color: rgba(255, 255, 255, 0.14);
        color: #f8f9fa;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .pub-section-title {
        scroll-margin-top: 96px;
      }
      .research-intro {
        white-space: nowrap;
      }
      .research-img {
        width: 100%;
        height: 240px;
        max-height: 320px;
        object-fit: contain;
        object-position: center;
        background: rgba(0,0,0,0.03);
        display: block;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    {% include navbar.html %}

    <main class="flex-grow-1">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        const root = document.documentElement;
        const saved = localStorage.getItem("theme");
        if (saved) root.setAttribute("data-bs-theme", saved);

        const btn = document.getElementById("themeToggle");
        if (!btn) return;

        function syncIcon(theme) {
          const icons = btn.querySelectorAll(".theme-icon");
          icons.forEach(icon => {
            const isDark = icon.dataset.theme === "dark";
            icon.classList.toggle("d-none", theme === "dark" ? !isDark : isDark);
          });
        }

        function syncButtons(theme) {
          const buttons = document.querySelectorAll('[data-theme-btn="outline"]');
          buttons.forEach(button => {
            button.classList.toggle("btn-outline-dark", theme !== "dark");
            button.classList.toggle("btn-outline-light", theme === "dark");
          });
        }

        const initialTheme = root.getAttribute("data-bs-theme") || "light";
        syncIcon(initialTheme);
        syncButtons(initialTheme);

        btn.addEventListener("click", () => {
          const current = root.getAttribute("data-bs-theme") || "light";
          const next = current === "dark" ? "light" : "dark";
          root.setAttribute("data-bs-theme", next);
          localStorage.setItem("theme", next);
          syncIcon(next);
          syncButtons(next);
        });
      })();
    </script>
  </body>
</html>
