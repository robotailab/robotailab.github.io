<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) document.documentElement.setAttribute("data-bs-theme", savedTheme);
      } catch (error) {
        // Keep the default theme when storage is unavailable.
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/site.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="apple-touch-icon" href="/assets/img/logo.png">
  </head>
  <body class="d-flex flex-column min-vh-100">
    {% include navbar.html %}

    <main class="flex-grow-1">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        const root = document.documentElement;
        const btn = document.getElementById("themeToggle");
        if (!btn) return;

        function syncIcon(theme) {
          const icons = btn.querySelectorAll(".theme-icon");
          icons.forEach(icon => {
            const isDark = icon.dataset.theme === "dark";
            icon.classList.toggle("d-none", theme === "dark" ? !isDark : isDark);
          });
        }

        function syncButtons(theme) {
          const buttons = document.querySelectorAll('[data-theme-btn="outline"]');
          buttons.forEach(button => {
            button.classList.toggle("btn-outline-dark", theme !== "dark");
            button.classList.toggle("btn-outline-light", theme === "dark");
          });
        }

        const initialTheme = root.getAttribute("data-bs-theme") || "light";
        syncIcon(initialTheme);
        syncButtons(initialTheme);

        btn.addEventListener("click", () => {
          const current = root.getAttribute("data-bs-theme") || "light";
          const next = current === "dark" ? "light" : "dark";
          root.setAttribute("data-bs-theme", next);
          try {
            localStorage.setItem("theme", next);
          } catch (error) {
            // The selected theme still applies for the current page.
          }
          syncIcon(next);
          syncButtons(next);
        });
      })();
    </script>
  </body>
</html>
